[package]
name = "crawlwe"
version = "0.1.0"
edition = "2021"
description = "Fast web page scraper using Chrome DevTools Protocol"
license = "MIT"

[[bin]]
name = "crawlwe"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Chrome DevTools Protocol
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client (for downloading assets)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# URL parsing
url = "2"

# HTML parsing
scraper = "0.22"

# Regex
regex = "1"

# Time
chrono = "0.4"

# Base64
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
