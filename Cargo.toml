[package]
name = "crawlwe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crawlwe"
path = "src/main.rs"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Chrome DevTools Protocol
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
thiserror = "1"
url = "2"
base64 = "0.22"

[profile.release]
lto = true
opt-level = 3
