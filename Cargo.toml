[package]
name = "crawlwe"
version = "0.1.0"
edition = "2021"
description = "Web page extractor for ML training - captures HTML + CSS with full fidelity"
license = "MIT"

[lib]
name = "crawlwe_core"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "crawlwe"
path = "src/main.rs"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Chrome DevTools Protocol
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }

# HTML/CSS Parsing
html5ever = "0.27"
markup5ever_rcdom = "0.3"

# Regex
regex = "1"
lazy_static = "1.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/Time
chrono = "0.4"

# Utils
thiserror = "1"
url = "2"
base64 = "0.22"
regex-lite = "0.1"

[profile.release]
lto = true
opt-level = 3

[profile.dev]
opt-level = 1
