[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "crawlwe"
version = "0.1.0"
description = "Web page extractor for ML training - captures HTML + CSS with full fidelity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["web", "scraper", "css", "html", "ml", "training-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "cssbeautifier>=1.14.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
crawlwe = "crawlwe.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "crawlwe.crawlwe_core"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
